<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de contenido — ESvintage</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.CMS) {
      CMS.registerEventListener({
        name: "preSave",
        handler: ({ entry }) => {
          let data = entry.get("data");
          const items = data.get("items");
          if (items && typeof items.map === "function") {
            const updated = items.map((item) => {
              if (item && typeof item.get === "function" && !item.get("fecha_subida")) {
                return item.set("fecha_subida", new Date().toISOString());
              }
              return item;
            });
            data = data.set("items", updated);
          }
          return data;
        },
      });
    }
  </script>
</body>
</html>
