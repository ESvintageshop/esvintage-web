backend:
  name: git-gateway
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "paginas"
    label: "Páginas y ajustes generales"
    files:
      - name: "ajustes"
        label: "Ajustes generales (menú, redes sociales, email)"
        file: "content/ajustes.json"
        fields:
          - { name: "nav_inicio", label: "Texto del menú: Inicio", widget: "string" }
          - { name: "nav_productos", label: "Texto del menú: Productos", widget: "string" }
          - { name: "nav_conocenos", label: "Texto del menú: Conócenos", widget: "string" }
          - { name: "instagram", label: "Enlace de Instagram", widget: "string" }
          - { name: "tiktok", label: "Enlace de TikTok", widget: "string" }
          - { name: "email", label: "Email de contacto", widget: "string" }

      - name: "home"
        label: "Página de Inicio"
        file: "content/home.json"
        fields:
          - { name: "hero_titulo", label: "Titular principal", widget: "string" }
          - { name: "hero_subtitulo", label: "Subtítulo", widget: "string" }
          - { name: "hero_boton", label: "Texto del botón", widget: "string" }
          - { name: "seccion_titulo", label: "Título de la sección de productos destacados", widget: "string" }

      - name: "tienda"
        label: "Página de Productos (título)"
        file: "content/tienda.json"
        fields:
          - { name: "titulo", label: "Título de la página", widget: "string" }

      - name: "conocenos"
        label: "Conócenos"
        file: "content/conocenos.json"
        fields:
          - { name: "texto", label: "Texto de la página", widget: "text", hint: "Deja una línea en blanco entre párrafos." }

  - name: "ropa"
    label: "Ropa"
    files:
      - name: "ropa"
        label: "Ropa"
        file: "content/ropa.json"
        fields:
          - name: "items"
            label: "Prendas"
            widget: "list"
            label_singular: "prenda"
            fields:
              - { name: "titulo", label: "Nombre", widget: "string" }
              - { name: "precio", label: "Precio (€)", widget: "number", value_type: "float" }
              - { name: "descripcion", label: "Descripción", widget: "text", required: false }
              - { name: "talla", label: "Talla", widget: "string", required: false }
              - name: "imagenes"
                label: "Fotos"
                widget: "list"
                field: { name: "imagen", widget: "image" }
              - { name: "enlace_compra", label: "Link de compra (Vinted, Wallapop...)", widget: "string", required: false, hint: "Pega aquí el enlace del anuncio publicado. Si lo dejas vacío, no aparecerá botón de Comprar." }
              - { name: "disponible", label: "Disponible (desmarcar si está agotada)", widget: "boolean", default: true }

  - name: "accesorios"
    label: "Accesorios"
    files:
      - name: "accesorios"
        label: "Accesorios"
        file: "content/accesorios.json"
        fields:
          - name: "items"
            label: "Accesorios"
            widget: "list"
            label_singular: "accesorio"
            fields:
              - { name: "titulo", label: "Nombre", widget: "string" }
              - { name: "precio", label: "Precio (€)", widget: "number", value_type: "float" }
              - { name: "descripcion", label: "Descripción", widget: "text", required: false }
              - name: "imagenes"
                label: "Fotos"
                widget: "list"
                field: { name: "imagen", widget: "image" }
              - { name: "enlace_compra", label: "Link de compra (Vinted, Wallapop...)", widget: "string", required: false, hint: "Pega aquí el enlace del anuncio publicado. Si lo dejas vacío, no aparecerá botón de Comprar." }
              - { name: "disponible", label: "Disponible (desmarcar si está agotado)", widget: "boolean", default: true }

  - name: "libros"
    label: "Libros"
    files:
      - name: "libros"
        label: "Libros"
        file: "content/libros.json"
        fields:
          - name: "items"
            label: "Libros"
            widget: "list"
            label_singular: "libro"
            fields:
              - { name: "titulo", label: "Título", widget: "string" }
              - { name: "precio", label: "Precio (€)", widget: "number", value_type: "float" }
              - { name: "descripcion", label: "Descripción", widget: "text", required: false }
              - name: "imagenes"
                label: "Fotos"
                widget: "list"
                field: { name: "imagen", widget: "image" }
              - { name: "enlace_compra", label: "Link de compra (Vinted, Wallapop...)", widget: "string", required: false, hint: "Pega aquí el enlace del anuncio publicado. Si lo dejas vacío, no aparecerá botón de Comprar." }
              - { name: "disponible", label: "Disponible (desmarcar si está agotado)", widget: "boolean", default: true }
